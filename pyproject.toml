[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qedonia"
version = "0.1.0"
description = "LO coupled QCD⊗QED DGLAP evolution of J/ψ fragmentation functions (NRQCD)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qedonia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
